<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="header">
      <p>Find your film</p>
      <a href="watchlist.html" id="watchlist">My Watchlist</a>
    </div>
    <search>
      <form method="GET" class="search-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input id="searchInput" type="search" placeholder="Search for a movie" />
        </div>
        <button id="searchButton" type="submit">Search</button>
      </form>
    </search>
    <div class="hero-center">
        <img src="images/Icon.svg" alt="Home" width="24" height="24">
        <p>Start Exploring</p>
    </div>
    <div id="mainCard">
        <img src="https://m.media-amazon.com/images/M/MV5BMjUyNTA3MTAyM15BMl5BanBnXkFtZTgwOTEyMTkyMjE@._V1_SX300.jpg" >
        <div id="cardContent">
            <div id="title">
                <p id="titleHeading" >The Maze Runner</p>
                <p class="rating">⭐ 6.2</p>
            </div>
            <div id="highlightBox" > 
                <p class="runtime" >113 min</p>
                <p class="genre" >113 min Action, Mystery, Sci-Fi</p>
                <button>Watchlist</button>
            </div>
            <p id="description">A teen with no memory of the outside world awakens in a gigantic maze guarded by deadly creatures, and plots a daring escape.</p>
        </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>

<!-- Search Page calls api for title searched for and displays results-->
<!-- Button to add to watchlist data saved to local storage -->
